<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToS Companion</title>
  <link rel="stylesheet" href="/styles-20260922.css">
  <script src="/vendor/lightweight-charts-20260922.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">ToS Companion</div>
    <form id="symbol-form" class="symbol-form">
      <input id="symbol-input" autocomplete="off" maxlength="10" placeholder="SYMBOL">
      <button type="submit">Load</button>
    </form>
    <div id="connection-state" class="status">DISCONNECTED</div>
  </header>

  <main>
    <section class="quote-strip">
      <div><span>Symbol</span><strong id="symbol">--</strong></div>
      <div><span>Bid</span><strong id="bid">--</strong></div>
      <div><span>Ask</span><strong id="ask">--</strong></div>
      <div><span>Last</span><strong id="last">--</strong></div>
      <div><span>Volume</span><strong id="volume">--</strong></div>
    </section>

    <section class="workspace">
      <div class="chart-card">
        <div class="chart-legend" aria-label="Chart overlays">
          <span class="legend-vwap">VWAP</span>
          <span class="legend-ema9">EMA9</span>
          <span class="legend-ema20">EMA20</span>
          <span>PMH/PML</span>
          <span>ORH/ORL</span>
          <span>R/S</span>
        </div>
        <div id="chart"></div>
      </div>
      <aside>
        <section class="panel">
          <div class="panel-heading">
            <h2>Analysis</h2>
            <button id="llm-run" type="button">Run LLM</button>
          </div>
          <pre id="analysis">No analysis snapshot yet.</pre>
          <h2 class="subhead">LLM</h2>
          <pre id="llm-output">Not run.</pre>
        </section>
        <section class="panel">
          <h2>Recorder</h2>
          <div class="recorder-controls">
            <input id="recorder-symbols" placeholder="AEHL,TOPS">
            <button id="record-start" type="button">Start</button>
            <button id="record-stop" type="button">Stop</button>
          </div>
          <pre id="recorder">Inactive</pre>
        </section>
        <section class="panel">
          <h2>Server</h2>
          <div id="server-message">Connecting...</div>
          <div id="auth-status" class="auth-note">Schwab auth: checking companion_auth...</div>
        </section>
      </aside>
    </section>
  </main>

  <script src="/app-20260922-4.js"></script>
</body>
</html>
