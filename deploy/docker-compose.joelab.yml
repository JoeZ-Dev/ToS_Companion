services:
  tos-companion:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        TOS_COMPANION_GIT_REVISION: ${TOS_COMPANION_GIT_REVISION:?deploy via deploy/deploy_joelab_docker.sh so provenance is populated}
        TOS_COMPANION_GIT_WORKTREE_DIRTY: ${TOS_COMPANION_GIT_WORKTREE_DIRTY:?deploy via deploy/deploy_joelab_docker.sh so provenance is populated}
    container_name: tos-companion
    restart: unless-stopped
    environment:
      AUTH_HELPER_URL: http://companion-auth:8766
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must match companion-auth}
      TOS_CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${TOS_CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      TOS_CLOUDFLARE_ACCESS_AUD: ${TOS_CLOUDFLARE_ACCESS_AUD:-}
      TOS_ADMIN_EMAILS: ${TOS_ADMIN_EMAILS:-}
      TOS_COMPANION_HOST: 0.0.0.0
      TOS_COMPANION_PORT: 8787
      TOS_COMPANION_LOG_LEVEL: info
      TOS_CODEX_BRIDGE_SOCKET: /run/tos-codex/bridge.sock
      TOS_CODEX_TIMEOUT_SECONDS: 120
      TOS_COMPANION_GIT_REVISION: ${TOS_COMPANION_GIT_REVISION}
      TOS_COMPANION_GIT_WORKTREE_DIRTY: ${TOS_COMPANION_GIT_WORKTREE_DIRTY}
    volumes:
      - tos-companion-data:/home/companion/.tos_companion
      - /srv/data/tos-companion/state:/home/companion/.local/share/MomentumTradingCompanion
      - /srv/data/tos-companion/codex-bridge:/run/tos-codex
    ports:
      - "127.0.0.1:4977:8787"
    networks:
      - joelab-ingress
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tos-companion-data:

networks:
  joelab-ingress:
    external: true
