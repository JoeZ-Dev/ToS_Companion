name: CI

on:
  push:
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt
          pip install pyinstaller
      - name: Run tests
        run: |
          chmod +x tools/ci.sh
          tools/ci.sh

  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Windows smoke (PyInstaller + mock run)
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          ./tools/windows_smoke.ps1


  browser-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt
      - name: Validate browser foundation
        run: |
          python -m compileall -q src/momentum_companion/session src/momentum_companion/runtime src/momentum_companion/recording src/momentum_companion/web
          pytest -q             tests/test_companion_session.py             tests/test_web_app.py             tests/test_stream_raw_recording.py             tests/test_market_day_recorder.py
