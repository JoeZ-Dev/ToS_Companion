name: Pattern Engine CI

on:
  push:
    branches:
      - feature/pattern-engine-foundation
  pull_request:
    paths:
      - 'src/momentum_companion/setup_engine/**'
      - 'src/momentum_companion/runtime/companion_runtime.py'
      - 'src/momentum_companion/session/companion_session.py'
      - 'tests/test_pattern_engine.py'
      - 'tests/test_pattern_service.py'
      - 'tests/test_companion_runtime.py'
      - 'tests/test_companion_session.py'
      - '.github/workflows/pattern-engine-ci.yml'

jobs:
  pattern-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt
      - name: Compile pattern integration
        run: |
          python -m compileall -q             src/momentum_companion/setup_engine             src/momentum_companion/runtime             src/momentum_companion/session
      - name: Run focused pattern tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q             tests/test_pattern_engine.py             tests/test_pattern_service.py             tests/test_companion_runtime.py             tests/test_companion_session.py
