name: Pattern Engine CI

on:
  push:
    branches:
      - feature/pattern-engine-foundation
  pull_request:
    paths:
      - 'src/momentum_companion/setup_engine/pattern_engine.py'
      - 'src/momentum_companion/setup_engine/pattern_contracts.py'
      - 'src/momentum_companion/setup_engine/patterns/**'
      - 'src/momentum_companion/setup_engine/structure/**'
      - 'tests/test_pattern_engine.py'
      - '.github/workflows/pattern-engine-ci.yml'

jobs:
  pattern-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile pattern engine
        run: python -m compileall -q src/momentum_companion/setup_engine
      - name: Run pattern tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_pattern_engine.py
