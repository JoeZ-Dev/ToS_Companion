[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-companion"
version = "0.1.0"
description = "Momentum Trading Companion MVP"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5,<7",
    "plotly>=5.18,<5.23",
    "httpx>=0.27,<0.28",
    "requests>=2.31,<3",
    "websocket-client>=1.7,<2",
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2",
    "platformdirs>=4.2,<5",
    "typing-extensions>=4.10,<5",
    "cryptography>=42",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]


[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
]

[tool.setuptools.package-data]
"momentum_companion.web" = ["static/*"]
"momentum_companion.ui" = ["assets/lightweight-charts.standalone.production.js"]
